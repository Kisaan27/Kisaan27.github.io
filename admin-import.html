        id: 2, tag: "Artificial Intelligence",
        title: "Development of a Surgical Difficulty Score for Open Reduction Internal Fixation of Pilon Fractures",
        abstract: "<p><strong>Objectives:</strong> To identify characteristics that contribute to surgical complexity in pilon fractures and to develop a machine learning (ML) Pilon Surgical Difficulty Score (PSDS) based on these factors.</p>",
        body: `<h2>Design</h2><p>Retrospective cohort study.</p>
<h2>Setting</h2><p>Academic Level I trauma center.</p>
<h2>Patient Selection Criteria</h2><p>Pilon fractures (OTA/AO Type 43) in adult patients treated with open reduction internal fixation.</p>
<h2>Outcomes Measures and Comparisons</h2><p>Various patient, injury, and radiological characteristics were assessed. Surgical difficulty was measured using 2 outcomes: (1) operative time and (2) perceived difficulty. Perceived difficulty was determined using the opinion of 16 fellowship-trained orthopaedic traumatologists on a 10-point scale. Significant predictors of difficulty were determined using univariate analyses. ML models were used to develop a PSDS for both operative time and surgical difficulty.</p>
<h2>Results</h2><p>One hundred operatively fixed pilon fractures were included. Predictors of operative time were age, OTA/AO classification, articular comminution, articular impaction, bone loss, delay to surgery, poor quality reduction, number of approaches, and number of articular fragments. Predictors of perceived difficulty included OTA/AO classification and delay to surgery. Operative time PSDS had a mean absolute error of 64 minutes and a 60-minute buffer accuracy of 59%. Perceived difficulty PSDS had a mean absolute error of 1.7 points and a 2-point buffer accuracy of 63%.</p>
<h2>Conclusion</h2><p>ML was used to generate accurate PSDSs for operative time and difficulty for pilon fractures. Future work should aim to clinically validate these PSDSs, so they may improve patient outcomes.</p>
<p><strong>Level of evidence:</strong> Level III Diagnostic.</p>`

        abstract: "<p><strong>Background:</strong> Venous thromboembolism (VTE) following total hip arthroplasty and total knee arthroplasty (TKA) is linked to immobility, and preoperative prediction remains difficult. We aimed to evaluate whether annual mean length of stay (LOS) is associated with the incidence of VTE and develop a generalizable machine learning model to preoperatively predict the incidence of symptomatic VTE following total hip and TKA using National Surgical Quality Improvement Program data.</p>",
        body: `<h2>Methods</h2><p>Annual incidence of 30-day postoperative VTE, deep vein thrombosis, and pulmonary embolism was calculated over 6 years and tested for trend. Correlation between annual VTE rates and mean LOS was calculated. Predictive models (logistic regression, random forest, and XGBoost) were trained and tested based on year of surgery with different oversampling algorithms used to address data imbalance.</p>
<h2>Results</h2><p>A total of 498,314 patients were included, with 0.88% developing a VTE within 30 days. VTE rates decreased from 1.11% in 2014 to 0.76% in 2019 (P &lt; .001). There was a strong correlation between the yearly incidence of VTE, pulmonary embolism, and deep vein thrombosis and mean LOS (r = 0.96, 0.87, and 0.98, respectively). Univariate analysis demonstrated that TKA, inpatient setting, American Society of Anesthesiologists classification, and various patient comorbidities were significantly associated with VTE. The logistic regression model trained on all data with a balanced loss scoring function performed the best (area under the curve = 0.600).</p>
<h2>Conclusions</h2><p>This study revealed declining VTE rates strongly correlated to decreasing postoperative LOS and identified patient and surgery-specific factors associated with VTE risk. Development of more accurate machine learning models for VTE prediction may improve risk stratification, prevention, and monitoring for arthroplasty patients.</p>
<p><strong>Keywords:</strong> Machine learning; Outcome prediction; Total hip arthroplasty; Total knee arthroplasty; Venous thromboembolism.</p>`

        abstract: "<p>Clinician teachers (CT) have historically felt undervalued and underappreciated. One technology used to increase motivation is gamification: the process of inserting elements of game-playing into activities that are not usually associated with games. We developed a mobile application that rewards CTs using in-app gamification techniques to increase CT motivation. This program was implemented specifically in a regional campus setting, Mississauga, Ontario.</p>",
        body: `<h2>Methods</h2><p>A cross-platform application that rewards physicians for their clinical teaching hours was created. This consisted of a star grading criteria where each physician was awarded depending on the number of hours completed. End-user perceptions of the application were evaluated using a survey with a Likert scale and open-ended questions. Survey results were collated with descriptive statistics and thematic analysis.</p>
<h2>Results</h2><p>The TutorTracker application was developed implementing a live gamification algorithm. It allows physicians to view their hours completed, rewards obtained, and add additional hours. The majority of CTs agreed or strongly agreed that the application was user-friendly, easy to navigate and enjoyed the rewards provided. Major themes that emerged were regarding additional features and full integration of such an application for rewarding teaching efforts.</p>

        abstract: "<p><strong>Objective:</strong> To determine the potential for improving elective surgery scheduling for total knee and hip arthroplasty (TKA and THA, respectively) by utilizing a two-stage approach that incorporates machine learning (ML) prediction of the duration of surgery (DOS) with scheduling optimization.</p>",
        body: `<h2>Materials and Methods</h2><p>Two ML models (for TKA and THA) were trained to predict DOS using patient factors based on 302,490 and 196,942 examples, respectively, from a large international database. Three optimization formulations based on varying surgeon flexibility were compared: Any (surgeons could operate in any operating room at any time), Split (limitation of two surgeons per operating room per day), and MSSP (limit of one surgeon per operating room per day). Two years of daily scheduling simulations were performed for each optimization problem using ML-prediction or mean DOS over a range of schedule parameters.</p>
<h2>Results</h2><p>The Any scheduling formulation performed significantly worse than the Split and MSSP formulations with respect to overtime and underutilization (p&lt;0.001). The latter two problems performed similarly (p&gt;0.05) over most schedule parameters. The ML-prediction schedules outperformed those generated using a mean DOS over all schedule parameters, with overtime reduced on average by 300 to 500 minutes per week. Using a 15-minute schedule granularity with a wait list pool of minimum 1 month generated the best schedules.</p>
<h2>Conclusion</h2><p>Assuming a full waiting list, optimizing an individual surgeon's elective operating room time using an ML-assisted predict-then-optimize scheduling system improves overall operating room efficiency, significantly decreasing overtime.</p>`

        title: "Simulation Optimization of Operating Room Schedules for Elective Orthopaedic Surgery",
        abstract: "<p>Our specific problem is to create daily schedules of elective surgeries in a multiple operating room setting with the goals of minimizing the amount of overtime incurred and maintaining patient volumes.</p>",
        body: `<p>While surgical durations cannot always be perfectly estimated and vary by procedure and surgeon, our approach relies on leveraging the stochastic nature of surgical durations to simulate each operating day and understand the probability of incurring overtime under a certain schedule of surgeries. The heuristic optimization component of our approach investigates the probabilistic evaluation and strategically re-schedules surgeries.</p>
<h2>Results</h2><p>Through experimentation with three optimization techniques, two showed promising results, being able to reduce the total number of overtime surgeries by 12&ndash;15%, equivalent to approximately 1h of total monthly overtime. Compared to the literature, this approach serves solely as a tool for improving schedules and can be used for supporting decision making at the hospital.</p>

        abstract: "<p><strong>Background:</strong> Scrub nurses play a crucial role in facilitating orthopaedic surgeries, and thus intraoperative scrub nurse turnover may disrupt the workflow of the surgical team and prolong duration of surgery (DOS). The purpose of this study was to quantify the impact of intraoperative scrub nurse turnover on operative time of orthopaedic surgeries lasting less than 3h in duration.</p>",
        body: `<h2>Methods</h2><p>Prospectively collected databases from two institutions were retrospectively queried to identify all orthopaedic procedures of maximum mean duration of 180min from March 4th, 2018 to August 31st, 2022. Cases were divided into two groups, those with scrub nurse turnover and those without. Propensity score matching was conducted to match groups by surgeon, hospital, patient age, gender, and ASA classification. Average treatment effect on treated (ATET) with 95% confidence intervals (CIs) were calculated.</p>
<h2>Results</h2><p>Scrub nurse turnover significantly prolonged DOS across multiple procedures, including bone forearm fracture ORIF (ATET=21.08, p=0.001), ankle ORIF (ATET=21.26, p&lt;0.001), clavicle ORIF (ATET=16.16, p=0.028), femur intramedullary nail (ATET=11.52, p=0.003), rotator cuff repair (ATET=16.88, p&lt;0.001), partial discectomy (ATET=10.52, p=0.001), total knee arthroplasty (ATET=5.69, p&lt;0.001), anterior total hip arthroplasty (ATET=8.80, p&lt;0.001), lateral THA (ATET=7.02, p&lt;0.001), and uncemented hip hemiarthroplasty (ATET=16.79, p=0.049).</p>
<h2>Conclusion</h2><p>Intraoperative scrub nurse turnover significantly prolongs surgical times in orthopaedic surgeries lasting up to 3h in duration, highlighting the importance of developing strategies to prevent turnover to improve OR efficiency and decrease healthcare costs.</p>
<p><strong>Keywords:</strong> Efficiency; Operating room; Orthopaedic surgery; Scrub nurse; Surgical waitlists.</p>`

        title: "Current State of Systematic Reviews for Platelet-Rich Plasma Use in Knee Osteoarthritis",
        abstract: "<p><strong>Background:</strong> Knee osteoarthritis (KOA) is a highly prevalent musculoskeletal disorder affecting millions of people. To date, there is no curative treatment for KOA other than joint arthroplasty. Platelet-rich plasma (PRP) has been proposed as a possible therapy, but there are no evidence-based guidelines for its use. This study evaluates the methodological quality of systematic reviews (SRs) on PRP therapy for KOA using AMSTAR 2, a validated assessment tool.</p>",

<h2>Results</h2><p>Forty-one SRs were included in the analysis. The Cohen kappa was 0.88, indicating high interrater reliability. There were no "high" quality SRs identified. Seven SRs (17%) were of "low" quality, while the remainder (34 SRs, 83%) were rated as "critically low".</p>

        abstract: "<p><strong>Objective:</strong> Smart insufflation (SI) techniques relying on valve and membrane-free insufflation are increasing in usage. Although considerable literature exists demonstrating the benefits of SI on procedural ease and patient outcomes, there remains a paucity describing the financial impact of these devices. This study determines the financial and efficiency impact of these devices on the operating room and inpatient wards of a hospital.</p>",

        abstract: "<p><strong>Background:</strong> Academic meetings serve as an opportunity to present and discuss novel ideas. Previous studies have identified factors predictive of publication without generating predictive models. This study used machine learning (ML) models to predict subsequent publication of abstracts presented at a major surgical conference.</p>",
        body: `<h2>Methods</h2><p>All abstracts from the North American Spine Society (NASS) annual general meetings from 2013&ndash;2015 were reviewed, extracting number of authors, institution, location, conference category, subject category, study type, data collection methodology, human subject research, and FDA approval. Abstracts were searched on PubMed, Google Scholar, and Scopus for publication, and ML models were trained to predict publication.</p>
<h2>Results</h2><p>A total of 1119 abstracts were presented, with 553 (49%) published. During training, the partial least squares model performed best (AUC of 0.77&plusmn;0.05). During testing, the random forest model performed best (AUC of 0.69, accuracy of 67%). Top features included number of authors, year, conference category, subject category, human subjects research, continent, and data collection methodology.</p>

<h2>Results</h2><p>All navigation platforms demonstrated significant reduction in risk of breach, with Stryker demonstrating the highest accuracy compared to controls (OR 0.16, P &lt; 0.00001) followed by Medtronic. BrainLab demonstrated significantly faster operative time compared to Medtronic by 30 min (P = 0.03). Together, there was significantly lower risk of major breach in the navigation group compared to controls (OR 0.42, P &lt; 0.0001).</p>
<h2>Conclusions</h2><p>Stryker demonstrated the highest accuracy, and Brainlab the shortest operative time, both followed by Medtronic. No significant difference was found between platforms regarding neurologic complications or blood loss. This study is the first to directly compare available navigation platforms, offering insight for institutional procurement of platforms.</p>

        abstract: "<p><strong>Background:</strong> In-office needle arthroscopy (IONA) has been described as a diagnostic alternative to MRI for intra-articular pathology, but few studies have analyzed its impact on cost and wait times as a therapeutic intervention. This study investigates the impact on cost and wait times of offering IONA for partial medial meniscectomy as an alternative to traditional operating room (OR) arthroscopy.</p>",
        body: `<h2>Methods</h2><p>Two models were created comparing the existing care pathway to a proposed future state utilizing IONA, using accounting data from an academically affiliated hospital in Canada. A Monte Carlo simulation combined with DuPont analysis running 10,000 simulations calculated revenue, expenses, profits, and effect on surgical waitlists between the states.</p>
<h2>Results</h2><p>An average of 198 (SD 31) patients underwent arthroscopic meniscectomy or repair each year from 2016 to 2020. The IONA revision rate was 20.3%. Annual expenses in the IONA pathway were significantly reduced ($266,912.68 versus $281,415.23, p &lt; .0001), while improving throughput by 21.2%.</p>
<h2>Conclusions</h2><p>IONA is a cost-effective alternative to traditional OR arthroscopy in patients undergoing partial medial meniscectomy. Next steps are to assess patient perceptions of IONA and carry out clinical trials to determine efficacy and outcomes.</p>

        title: "Immersive Virtual Reality and Cadaveric Bone Are Equally Effective in Skeletal Anatomy Education: A Randomized Crossover Noninferiority Trial",
        abstract: "<p><strong>Objective:</strong> Immersive virtual reality (IVR) technology is transforming medical education. This study compares the effectiveness of IVR with cadaveric bone models in teaching skeletal anatomy.</p>",
        body: `<h2>Design</h2><p>A randomized crossover noninferiority trial was conducted in the anatomy laboratory of a large medical school.</p>
<h2>Participants</h2><p>Incoming first-year medical students were randomized to IVR or cadaveric groups studying upper limb skeletal anatomy, then crossed over to the opposite tool to study lower limb skeletal anatomy, completing pre- and postintervention knowledge tests.</p>
<h2>Results</h2><p>Fifty first-year medical students were randomized. Score increase between tests was 15.0% in the upper limb IVR group versus 16.7% for cadaveric bones (p = 0.286). For the lower limb, score increase was 22.6% in the IVR group versus 22.5% in the cadaveric bone group (p = 0.936). 79% of participants found IVR most valuable for teaching 3-dimensional orientation and anatomical relationships.</p>
<h2>Conclusions</h2><p>There was no significant difference in knowledge gained after using IVR or cadaveric bones for skeletal anatomy education, with implications for medical schools facing challenges in acquiring cadaveric specimens.</p>
<p><strong>Keywords:</strong> medical education; orthopaedic surgery; skeletal anatomy; surgical education; virtual reality.</p>

        id: 14, tag: "Efficiency",
        title: "Improving Resource Utilization for Arthroplasty Care by Leveraging Machine Learning and Optimization: A Systematic Review",
        abstract: "<p><strong>Background:</strong> There is a growing demand for total joint arthroplasty (TJA) surgery. The applications of machine learning (ML), mathematical optimization, and computer simulation have the potential to improve efficiency of TJA care delivery through outcome prediction and surgical scheduling optimization, easing the burden on health-care systems. This study evaluates strategies using advances in analytics and computational modeling that may improve planning and the overall efficiency of TJA care.</p>",
        body: `<h2>Methods</h2><p>A systematic review including MEDLINE, Embase, and IEEE Xplore databases was completed from inception to October 3, 2022, for identification of studies generating ML models for TJA length of stay, duration of surgery, and hospital readmission prediction. A scoping review of optimization strategies in elective surgical scheduling was also conducted.</p>
<h2>Results</h2><p>Twenty studies were included for evaluating ML predictions and 17 in the scoping review of scheduling optimization. Among studies generating linear or logistic control models alongside ML models, only 1 found a control model to outperform its ML counterpart. Neural networks performed superior to or at the same level as conventional ML models in all but 1 study. Implementation of mathematical and simulation strategies improved optimization efficiency when compared to traditional scheduling methods at the operational level.</p>
<h2>Conclusions</h2><p>High-performing predictive ML-based models have been developed for TJA, as have mathematical strategies for elective surgical scheduling optimization. Leveraging artificial intelligence for outcome prediction and surgical optimization offers greater opportunities for improved resource utilization and cost-savings than traditional modeling and scheduling methods.</p>
<p><strong>Keywords:</strong> Artificial intelligence; Optimization; Predictive modeling; Surgical scheduling; Total hip arthroplasty; Total knee arthroplasty.</p>
<p><a href="https://pubmed.ncbi.nlm.nih.gov/36938350/" target="_blank" rel="noopener noreferrer">View source publication</a></p>`

        id: 15, tag: "Artificial Intelligence",
        title: "Artificial Intelligence for Hip Fracture Detection and Outcome Prediction: A Systematic Review",
        abstract: "<p><strong>Importance:</strong> Artificial intelligence (AI) enables powerful models for establishment of clinical diagnostic and prognostic tools for hip fractures; however the performance and potential impact of these newly developed algorithms are currently unknown. <strong>Objective:</strong> To evaluate the performance of AI algorithms designed to diagnose hip fractures on radiographs and predict postoperative clinical outcomes following hip fracture surgery relative to current practices.</p>",
        body: `<h2>Data Sources</h2><p>A systematic review of the literature was performed using the MEDLINE, Embase, and Cochrane Library databases for all articles published from database inception to January 23, 2023, with a manual reference search of included articles.</p>
<h2>Methods</h2><p>Studies developing machine learning (ML) models for the diagnosis of hip fractures from hip or pelvic radiographs, or to predict any postoperative patient outcome following hip fracture surgery, were included. This study followed PRISMA guidelines and was registered with PROSPERO. Diagnostic accuracy of AI models was compared with expert clinicians using odds ratios, and areas under the curve for postoperative outcome prediction were compared between traditional statistical models and ML models.</p>
<h2>Results</h2><p>Of 39 studies included, 18 (46.2%) used AI models to diagnose hip fractures on plain radiographs and 21 (53.8%) used AI models to predict patient outcomes. A total of 39,598 plain radiographs and 714,939 hip fractures were used for training, validating, and testing the models. Mortality and length of hospital stay were the most predicted outcomes. Compared with clinicians, the OR for diagnostic error of ML models was 0.79 (95% CI, 0.48-1.31; P = .36). The mean sensitivity was 89.3%, specificity was 87.5%, and F1 score was 0.90. The mean area under the curve for mortality prediction was 0.84 with ML models compared with 0.79 for alternative controls (P = .09).</p>
<h2>Conclusions and Relevance</h2><p>The performance of AI in diagnosing hip fractures was comparable with that of expert radiologists and surgeons. However, current implementations of AI for outcome prediction do not seem to provide substantial benefit over traditional multivariable predictive statistics.</p>
<p><a href="https://pubmed.ncbi.nlm.nih.gov/36930153/" target="_blank" rel="noopener noreferrer">View source publication</a></p>`
      },
      {
        id: 16, tag: "Efficiency",
        title: "Optimizing Spine Surgery Instrument Trays to Immediately Increase Efficiency and Reduce Costs in the Operating Room",
        abstract: "<p><strong>Background:</strong> Over-crowded surgical trays result in perioperative inefficiency and unnecessary costs. This study compared three tray-reduction methods: clinician review (CR), mathematical programming (MP), and a novel hybrid model (HM) based on surveys and cost analysis, hypothesizing the easy-to-implement HM would achieve reductions comparable to CR and MP.</p>",
        body: `<h2>Methods</h2><p>Three approaches were tested: CR, MP, and HM. Five neurosurgeons and three orthopedic surgeons who performed a total of 5,437 spine cases over a 4-year period (2017-2021) were interviewed. In CR, surgeons suggested which instruments should be removed. MP was performed via mathematical analysis of 25 observations of tray use. The HM was performed via a structured survey of surgeons' estimated instrument usage, followed by a cost-based inflection point analysis.</p>
<h2>Results</h2><p>The CR, MP, and HM approaches resulted in total instrument reductions of 41%, 35%, and 38%, respectively, corresponding to annual cost savings of $50,211.20, $46,348.80, and $44,417.60.</p>
<h2>Conclusions</h2><p>Despite MP being the most accurate methodology, savings were similar across all three methods. CR and HM are significantly less laborious and are practical alternatives for hospitals scrutinizing surgical inventory.</p>

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      const lockedCard = document.getElementById('locked-card');
      const unlockedCard = document.getElementById('unlocked-card');

      if (!session) {
        lockedCard.style.display = 'block';
        return;
      }

      unlockedCard.style.display = 'block';
      const importBtn = document.getElementById('import-btn');
      const log = document.getElementById('log');

      importBtn.addEventListener('click', async () => {
        importBtn.disabled = true;
        importBtn.innerHTML = 'Importing...';
        log.innerHTML = '';

        for (const article of articles) {
          const { error } = await _supabase.from('articles').upsert({
            id: article.id,
            tag: article.tag,
            title: article.title,
            abstract: article.abstract,
            body: article.body,
            updated_at: new Date().toISOString(),
          });

          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = error
            ? `<span>#${article.id} ${article.title}</span><span class="fail">${error.message}</span>`
            : `<span>#${article.id} ${article.title}</span><span class="ok">Saved</span>`;
          log.appendChild(row);
        }

        importBtn.innerHTML = '<i class="fa-solid fa-check"></i> Import Complete';
      });
    });
