<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="icon" type="image/svg+xml" href="images/drawing24.svg">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Slate Surgery</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="login.css">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <div class="auth-card">
            <div class="auth-form-section">
                <div class="brand"><img src="images/drawing22.svg" alt="Slate Surgery"></div>

                <div class="form-header">
                    <h1>Admin Access Only</h1>
                    <p>Please enter your email and password</p>
                </div>

                <form id="login-form">
                    <div class="input-field">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="name@ortho-care.com" required>
                    </div>
                    <div class="input-field">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="••••••••••••" required>
                    </div>
                    
                    <button type="submit" class="submit-btn">Sign In</button>
                </form>

                <div class="form-footer">
                    <a href="#">Forgot Password?</a>
                    <a href="index.html">Back to Home</a>
                </div>
            </div>

            <div class="auth-image-section">
                <div class="image-container">
                    <img src="images/login.png" alt="Clinical Team">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
