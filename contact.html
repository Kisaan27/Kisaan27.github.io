  <style>
    /* forarticle.css is shared with research.html, which keeps its own darker
       green palette, so its root can't be edited directly — override the
       brand variables here instead, scoped to just this page, to match the
       homepage's navy/sage palette. */
    :root {
      --text-dark: #10142a;
      --text-muted: rgba(16, 20, 42, 0.6);
      --brand-green: #1e274b;
      --accent-mint: #7aaa66;
    }
    body {
      background:
        radial-gradient(ellipse 1000px 700px at 6% -8%, rgba(30,39,75,0.18), transparent 55%),
        radial-gradient(ellipse 900px 650px at 100% 105%, rgba(122,170,102,0.16), transparent 55%),
        linear-gradient(160deg, #e9ebf1 0%, #dfe2ea 50%, #e6eae1 100%);
    }
    .contact-wrapper {
      width: 100%;
      max-width: 1360px;
      margin: 0 auto;
      padding: 56px 2rem 4rem;
      position: relative;
      z-index: 5;
    }

    .contact-card {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(30,39,75,0.1);
      box-shadow: 0 30px 60px rgba(16,20,42,0.16);
    }

    .contact-card-inner {
      display: grid;
      /* The form needs the room — the left pane is decorative, so it gets
         the smaller share rather than an even split. */
      grid-template-columns: 0.78fr 1.22fr;
      align-items: stretch;
      min-height: 680px;
    }

    .contact-image-pane {
      position: relative;
      min-height: 100%;
      border-radius: 0 0 0 28px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 66% 44% at 50% 42%, #2b3865 0%, #1a2340 45%, transparent 72%),
        linear-gradient(168deg, #161d38 0%, #111731 58%, #0a0e1f 100%);
    }

    /* Vignette so the corners fall away and the column holds the eye. */
    .contact-image-pane::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 72% 62% at 50% 46%, transparent 42%, rgba(5,8,18,0.6) 100%);
    }

    /* Absolutely positioned (and centred via inset+auto margins) so this very
       tall, narrow artwork cannot contribute its intrinsic height to the
       auto-sized grid row — in flow, its aspect ratio rather than the row's
       min-height ends up driving the whole card's height. */
    /* Absolutely positioned so the canvas can never contribute intrinsic
       size to the auto-sized grid row — in flow it drives the card's height
       instead of the row's own min-height. */
    .brand-scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .contact-image-pane.is-ready .brand-scene { opacity: 1; }

    /* ---- Right pane ---- */
    .contact-form-pane {
      position: relative;
      overflow: hidden;
      padding: 4rem 4.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(180deg, #ffffff 0%, #fafbfd 100%);
    }

    .contact-title {
      font-size: clamp(2rem, 2.9vw, 2.85rem);
      font-weight: 750;
      letter-spacing: -0.028em;
      line-height: 1.1;
      color: #10142a;
      margin-bottom: 0.9rem;
    }

    .contact-subtitle {
      font-size: 1.02rem;
      line-height: 1.65;
      color: #5b6578;
      max-width: 470px;
      margin: 0 0 2.4rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.35rem;
    }

    .form-group label {
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #7d8699;
    }

    .form-group input,
    .form-group textarea {
      display: block;
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      color: #10142a;
      background: #fbfcfe;
      border: 1px solid rgba(30,39,75,0.16);
      border-radius: 15px;
      padding: 1rem 1.15rem;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder { color: #9aa3b5; }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #1e274b;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(30,39,75,0.09);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 152px;
      line-height: 1.55;
    }

    .contact-submit {
      width: 100%;
      margin-top: 0.6rem;
      justify-content: center;
      background: #1e274b;
      color: #ffffff;
      border: none;
      padding: 1.05rem 1.75rem;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .contact-submit i { transition: transform 0.2s ease; }

    .contact-submit:hover {
      background: #2a3663;
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(30,39,75,0.22);
    }

    .contact-submit:hover i { transform: translateX(3px); }

    .contact-submit:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }

    .contact-success {
      display: none;
      align-items: center;
      gap: 0.6rem;
      color: #43713a;
      font-weight: 600;
      font-size: 0.92rem;
      margin-top: 1.25rem;
    }

    .contact-success.visible {
      display: flex;
    }

    @media screen and (max-width: 800px) {
      .contact-card-inner {
        grid-template-columns: 1fr;
      }
      .contact-image-pane {
        height: 260px;
        border-radius: 0;
      }
      .contact-wrapper {
        padding-top: 0;
        padding-left: 0;
        padding-right: 0;
        padding-bottom: 0;
      }
      .contact-card {
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    @media screen and (max-width: 640px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .contact-form-pane {
        padding: 2rem 1.5rem;
      }
    }

    /* footer.css / search-dropdown.css ship a hardcoded bright-green accent
       shared with research.html, which keeps its own palette — override it

    .site-footer .footer-bubble:hover { background: #7aaa66; border-color: #7aaa66; }
    .search-suggest-item i { color: #7aaa66; }
    .search-suggest-item strong { color: #7aaa66; }
  </style>

  <main class="contact-wrapper">
    <div class="contact-card">
      <div class="contact-card-inner">
        <div class="contact-image-pane" id="brand-scene-pane">
          <canvas class="brand-scene" id="brand-scene" role="img"
                  aria-label="Rotating three-dimensional rendering of the Slate Surgery cube mark"></canvas>
        </div>
        <div class="contact-form-pane">
          <h1 class="contact-title">Let's get in touch.</h1>
          <p class="contact-subtitle">
            Questions about our research, or a collaboration you'd like to explore?
            Send a note and our team will come back to you.
          </p>

          <form id="contact-form">
            <div class="form-row">
              <div class="form-group">
                <label for="contact-name">Name</label>
                <input type="text" id="contact-name" name="name" placeholder="Your name" required>
              </div>
              <div class="form-group">
                <label for="contact-email">Email</label>
                <input type="email" id="contact-email" name="email" placeholder="you@example.com" required>
              </div>
            </div>
            <div class="form-group">
              <label for="contact-message">Message</label>
              <textarea id="contact-message" name="message" placeholder="How can we help?" required></textarea>
            </div>
            <button type="submit" class="contact-submit" id="contact-submit-btn">
              Send message <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="contact-success" id="contact-success">
              <i class="fa-solid fa-circle-check"></i> Thanks — we'll be in touch soon.
            </div>
            <div class="contact-error" id="contact-error" style="display:none; color:#c0392b; font-weight:600; font-size:0.92rem; margin-top:1.25rem;"></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <a href="index.html" class="footer-logo"><img src="images/logo-cube-icon.png" alt="Slate Surgery logo" class="footer-logo-img">SLATE SURGERY</a>
        <span class="footer-copy">&copy; 2026 Slate Surgery. All rights reserved.</span>
      </div>
      <div class="footer-bubbles">
        <a href="login.html" class="footer-bubble" aria-label="Sign In" title="Sign In"><i class="fas fa-user"></i></a>
        <a href="contact.html" class="footer-bubble" aria-label="Contact Us" title="Contact Us"><i class="fas fa-envelope"></i></a>
        <button type="button" class="footer-bubble" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top" title="Back to top"><i class="fas fa-arrow-up"></i></button>
      </div>
    </div>
  </footer>

  <script>
    const _supabase = supabase.createClient(
      'https://brreqfxtesvavfdaidwi.supabase.co',
      'sb_publishable_3x4bvAl-vr2bBgNZkzh04w_suiCtcf5'
    );

    const contactForm = document.getElementById('contact-form');
    const submitBtn = document.getElementById('contact-submit-btn');
    const successEl = document.getElementById('contact-success');
    const errorEl = document.getElementById('contact-error');

    contactForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      errorEl.style.display = 'none';
      successEl.classList.remove('visible');

      const name = document.getElementById('contact-name').value.trim();
      const email = document.getElementById('contact-email').value.trim();
      const message = document.getElementById('contact-message').value.trim();

      const originalHtml = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const { error } = await _supabase
        .from('contact_messages')
        .insert({ name, email, message });

      submitBtn.disabled = false;
      submitBtn.innerHTML = originalHtml;

      if (error) {
        errorEl.textContent = 'Something went wrong: ' + error.message;
        errorEl.style.display = 'block';
        return;
      }

      successEl.classList.add('visible');
      contactForm.reset();
    });

    (function () {
      const navBtn = document.getElementById('navHamburger');
      const navLinks = document.querySelector('.nav-links');
      if (!navBtn || !navLinks) return;
      function closeMenu() {
        navLinks.classList.remove('open');
        navBtn.classList.remove('open');
        navBtn.setAttribute('aria-expanded', 'false');
      }
      navBtn.addEventListener('click', () => {
        const open = !navLinks.classList.contains('open');
        navLinks.classList.toggle('open', open);
        navBtn.classList.toggle('open', open);
        navBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
      navLinks.addEventListener('click', (e) => { if (e.target === navLinks) closeMenu(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
    })();
  </script>
